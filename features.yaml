features:
  # Phase 1 — Cluster Core
  - name: state-store-bbolt
    status: complete
    phase: 1
    implementation: internal/statestore/bolt.go
    tests: internal/statestore/bolt_test.go
    documentation: README.md
    limitations:
      - Single-node only in Phase 1; Raft replication added in Phase 8
      - Watch ring buffer bounded to 65536 events by default

  - name: api-server
    status: complete
    phase: 1
    implementation: internal/server/server.go
    tests: pkg/api/handler/resource_test.go
    documentation: README.md
    limitations:
      - Phase 1 does not include full RBAC enforcement (Phase 7)
      - Server-side apply (strategic merge patch) added in Phase 9

  - name: watch-streams
    status: complete
    phase: 1
    implementation: pkg/api/watch/watcher.go
    tests: internal/statestore/bolt_test.go
    documentation: ""
    limitations:
      - Watch uses HTTP chunked streaming; WebSocket upgrade deferred

  - name: tls-bootstrap
    status: complete
    phase: 1
    implementation: pkg/security/ca.go
    tests: pkg/security/ca_test.go
    documentation: ""
    limitations:
      - Phase 1 generates self-signed root CA; external CA integration in Phase 7

  - name: cert-auth
    status: complete
    phase: 1
    implementation: pkg/security/ca.go, pkg/api/middleware/auth.go
    tests: pkg/security/ca_test.go
    documentation: ""
    limitations:
      - OIDC authentication deferred to Phase 7

  - name: token-auth
    status: complete
    phase: 1
    implementation: pkg/security/token.go, pkg/api/middleware/auth.go
    tests: pkg/security/ca_test.go
    documentation: ""
    limitations:
      - Static bootstrap token only; full ServiceAccount token controller in Phase 7

  - name: resource-crud
    status: complete
    phase: 1
    implementation: pkg/api/handler/resource.go
    tests: pkg/api/handler/resource_test.go
    documentation: ""
    limitations:
      - Strategic merge patch deferred to Phase 9
      - Server-side apply deferred to Phase 9

  - name: label-selectors
    status: complete
    phase: 1
    implementation: api/meta/selectors.go, internal/statestore/index.go
    tests: internal/statestore/bolt_test.go
    documentation: ""
    limitations: []

  - name: field-selectors
    status: complete
    phase: 1
    implementation: api/meta/selectors.go, internal/statestore/index.go
