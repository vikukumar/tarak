name: Deploy Documentation to GitHub Pages

on:
  workflow_run:
    workflows: ["Release & Version Management"]
    types:
      - completed
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'web/**'
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Sync Web Assets into Docs
        run: |
          echo "Building & Synchronizing Documentation Portal..."
          mkdir -p docs/assets docs/data

          # Sync any assets from web/public into docs
          if [ -d "web/public" ]; then
            echo "Copying web/public assets into docs..."
            cp -r web/public/* docs/ 2>/dev/null || true
          fi

          # Ensure CNAME is set for custom domain
          if [ ! -f "docs/CNAME" ]; then
            echo "tarak.vikshro.in" > docs/CNAME
          fi

          echo "Documentation assets prepared:"
          ls -la docs/
          ls -la docs/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
