name: Deploy Documentation to GitHub Pages

on:
  workflow_run:
    workflows: ["Release & Version Management"]
    types:
      - completed
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'web/**'
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vite React Documentation Web App
        run: |
          echo "Building Vite React Documentation Portal..."
          cd web
          npm ci || npm install
          npm run build
          cd ..

      - name: Prepare Documentation Distribution for GitHub Pages
        run: |
          echo "Synchronizing Vite React artifacts into docs..."
          rm -rf docs/assets docs/data docs/*.html docs/*.js docs/*.css
          mkdir -p docs/assets docs/data

          # Copy compiled Vite assets into docs
          if [ -d "web/dist" ]; then
            echo "Copying web/dist into docs..."
            cp -r web/dist/* docs/
          fi

          # Ensure CNAME and .nojekyll are set
          echo "tarak.vikshro.in" > docs/CNAME
          touch docs/.nojekyll

          echo "Documentation distribution prepared successfully:"
          ls -la docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
